[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devrag"
version = "0.1.0"
description = "RAG system for developer Q&A over codebases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.111.0",
  "uvicorn[standard]==0.30.1",
  "pydantic==2.7.4",
  "python-dotenv==1.0.1",
  "PyYAML==6.0.2",
  "openai>=1.40.0,<2",
  "litellm==1.44.23",
  "faiss-cpu==1.8.0.post1",
  "qdrant-client==1.10.1",
  "tree-sitter==0.22.3",
  "tree-sitter-languages==1.10.2",
  "sentence-transformers==3.0.1",
  "redis==5.0.7",
  "celery==5.4.0",
  "bm25s==0.2.0",
  "pytest==8.3.2",
  "httpx==0.27.0",
]

[tool.setuptools]
packages = [
  "src",
  "src.ingestion",
  "src.retrieval",
  "src.generation",
  "src.cache",
  "src.api",
  "src.api.routes",
]
