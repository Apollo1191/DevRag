version: '3.8'

services:
  # Main DevRag backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devrag-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.4-mini}
      - OPENAI_MAX_OUTPUT_TOKENS=${OPENAI_MAX_OUTPUT_TOKENS:-1200}
      - DEVRAG_EMBEDDING_PROVIDER=local
      - DEVRAG_VECTOR_BACKEND=${DEVRAG_VECTOR_BACKEND:-qdrant}
      - DEVRAG_QDRANT_COLLECTION=${DEVRAG_QDRANT_COLLECTION:-devrag_chunks}
      - DEVRAG_QDRANT_DIMENSION=${DEVRAG_QDRANT_DIMENSION:-384}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-devrag}
      - DEVRAG_CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./storage:/app/storage
      - ./workspaces:/app/workspaces
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/index_info"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - redis
      - qdrant

  # Redis for optional semantic caching (future extension)
  redis:
    image: redis:7-alpine
    container_name: devrag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    container_name: devrag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:-devrag}

volumes:
  redis_data:
  qdrant_storage:

networks:
  default:
    name: devrag-network
